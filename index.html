  const weekCheckins = getCheckinsInPeriod(7);

  let html = `<h1 class="section-title">Progresso</h1>
    <div class="streak-hero">
      <span class="fire">🔥</span>
      <div>
        <div class="num">${streak} dia${streak===1?'':'s'}</div>
        <div class="lbl">Sequência atual</div>
      </div>
    </div>

    <div class="section-label">Calendário semanal</div>
    <div class="card">${buildProgressWeekCalendar()}</div>
  `;

  // Qualidade dos últimos 7 dias — barras grossas fixas na ordem cronológica da semana (DOM→SÁB)
  html += `<div class="section-label">Qualidade dos últimos 7 dias</div>
    <div class="card">${buildQualityBarSection(7)}</div>`;

  // Qualidade dos últimos 30 dias — matriz de blocos (heatmap), sem scroll horizontal
  html += `<div class="section-label">Qualidade dos últimos 30 dias</div>
    <div class="card">${buildQualityHeatmap(30)}</div>`;

  // Médias do período — grid de métricas pequenas e organizadas (dashboard), não linhas soltas
  const avgQuality = weekRecords.length ? (weekRecords.reduce((a,r)=>a+r.quality,0)/weekRecords.length) : null;
  const withDuration = weekRecords.filter(r=>r.durationMin != null);
  const avgDuration = withDuration.length ? Math.round(withDuration.reduce((a,r)=>a+r.durationMin,0)/withDuration.length) : null;
  let good=0, regular=0, low=0;
  weekRecords.forEach(r=>{ if(r.quality>=4) good++; else if(r.quality===3) regular++; else low++; });

  html += `<div class="section-label">Seu sono nos últimos 7 dias</div>
    <div class="metrics-grid">
      <div class="metric-card${avgDuration===null?' wide':''}"><div class="metric-val">${avgQuality!==null ? fmtAvg5(avgQuality) : '—'}</div><div class="metric-lbl">Qualidade do sono</div></div>
      ${avgDuration!==null ? `<div class="metric-card"><div class="metric-val">${minutesToDuration(avgDuration)}</div><div class="metric-lbl">Duração média</div></div>` : ''}
      ${weekRecords.length ? `<div class="metric-card wide">
        <div class="metric-dist">
          <div class="metric-dist-item"><span class="n" style="color:#2FA867;">${good}</span><span class="t">boa</span></div>
          <div class="metric-dist-item"><span class="n" style="color:#E8B23D;">${regular}</span><span class="t">regular</span></div>
          <div class="metric-dist-item"><span class="n" style="color:#D64545;">${low}</span><span class="t">baixa</span></div>
        </div>
        <div class="metric-lbl" style="margin-top:8px;">Distribuição</div>
      </div>` : ''}
    </div>
  `;

  // Energia — sempre lida como percepção subjetiva do usuário, nunca como medição
  // Considera tanto os check-ins quanto a resposta do questionário inicial (linha de base, que vive em
  // sleepRecords). Antes só os check-ins entravam na conta, então logo após o questionário aparecia "—".
  // Um valor por dia; o check-in prevalece sobre o registro do mesmo dia.
  const energyByDate = {};
  weekRecords.forEach(r=>{ if(r.energyWake) energyByDate[r.date] = r.energyWake; });
  weekCheckins.forEach(c=>{ if(c.energyWake) energyByDate[c.date] = c.energyWake; });
  const energyWakeVals = Object.values(energyByDate);
  const avgGain = energyWakeVals.length ? (energyWakeVals.reduce((a,b)=>a+b,0)/energyWakeVals.length) : null;

  html += `<div class="section-label">Energia · sua percepção</div>
    <div class="metrics-grid">
      <div class="metric-card wide"><div class="metric-val">${avgGain!==null ? fmtAvg5(avgGain) : '—'}</div><div class="metric-lbl">Ganho de energia ao acordar</div></div>
    </div>
  `;

  // Resumo — card principal com maior destaque (fundo azul suave), fecha a seção
  html += `<div class="section-label">Resumo</div><div class="summary-card"><div class="interpretation" style="margin-top:0;">`;
  if(weekRecords.length === 0 && weekCheckins.length === 0){
    html += `Ainda não há dados suficientes neste período.`;
  }else{
    const parts = [];
    if(weekRecords.length){
      parts.push(`Nos últimos 7 dias, sua qualidade média foi de <b>${fmtAvg5(avgQuality)}</b>.`);
      parts.push(`Você registrou <b>${weekRecords.length}</b> noite${weekRecords.length===1?'':'s'} neste período.`);
    }
    if(weekCheckins.length){
      parts.push(`Foram feitos <b>${weekCheckins.length}</b> check-in${weekCheckins.length===1?'':'s'} diário${weekCheckins.length===1?'':'s'}.`);
    }
    html += parts.join('<br>');
  }
  html += `</div></div>`;

  el.innerHTML = html;
}

/* média de 1–5 no formato "4,0 / 5" */
function fmtAvg5(v){ return v.toFixed(1).replace('.',',') + ' / 5'; }

function weekdayShort(dateKey){
  const dow = new Date(dateKey+'T00:00:00').getDay();
  return WEEKDAY_LABELS[dow];
}

function computeConsistency(records){
  if(records.length === 0) return null;
  const plannedSleep = toMinutes(state.answers.bedtime) ?? toMinutes('23:00');
  const plannedWake = toMinutes(state.answers.waketime) ?? toMinutes('07:00');
  let totalDevMin = 0;
  for(const r of records){
    const s = toMinutes(r.sleepTime), w = toMinutes(r.wakeTime);
    let devS = Math.min(Math.abs(s-plannedSleep), 1440-Math.abs(s-plannedSleep));
    let devW = Math.min(Math.abs(w-plannedWake), 1440-Math.abs(w-plannedWake));
    totalDevMin += (devS+devW)/2;
  }
  const avgDev = totalDevMin/records.length; // minutes
  const pct = Math.max(0, Math.round(100 - (avgDev/120)*100)); // 120min deviation => 0%
  return Math.min(100,pct);
}

/* Plano cartesiano compartilhado — mesma linguagem visual (eixos, grade sutil) para a barra
   única de "Qualidade do último dia" e para as barras de "Qualidade dos últimos 7 dias",
   com ou sem dados reais. Barras verticais grossas e arredondadas (boas de ler no celular).
   Nunca preenche com valores inventados. */
let _chartUid = 0;
function roundedTopBarPath(x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h));
  return `M${x.toFixed(1)},${(y+h).toFixed(1)} V${(y+r).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x+r).toFixed(1)},${y.toFixed(1)} H${(x+w-r).toFixed(1)} Q${(x+w).toFixed(1)},${y.toFixed(1)} ${(x+w).toFixed(1)},${(y+r).toFixed(1)} V${(y+h).toFixed(1)} Z`;
}
function buildCartesianChart(points){
  const uid = 'qbar' + (++_chartUid);
  const w=340, h=190, padL=26, padR=10, padT=24, padB=28;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const yMin=0, yMax=5; // barras nascem da base (0); notas vão de 1 a 5
  const yToPx = y => padT + innerH - ((y-yMin)/(yMax-yMin))*innerH;
  const baseY = h - padB;

  let grid = '';
  for(let gy=1; gy<=yMax; gy++){
    const py = yToPx(gy);
    grid += `<line x1="${padL}" y1="${py.toFixed(1)}" x2="${w-padR}" y2="${py.toFixed(1)}" stroke="var(--gray-3)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(py+3.5).toFixed(1)}" font-size="10" fill="var(--gray-1)" text-anchor="end">${gy}</text>`;
  }
  const axes = `<line x1="${padL}" y1="${padT-4}" x2="${padL}" y2="${baseY}" stroke="var(--gray-2)" stroke-width="1.5"/>
    <line x1="${padL}" y1="${baseY}" x2="${w-padR}" y2="${baseY}" stroke="var(--gray-2)" stroke-width="1.5"/>`;

  let data = '';
  if(points.length){
    const n = points.length;
    const slot = innerW / n;
    const bw = Math.max(10, Math.min(n===1 ? 56 : 40, slot*0.62));
    const rad = Math.min(10, bw/2);
    data += `<defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D7BFF"/><stop offset="100%" stop-color="#0044CC"/>
    </linearGradient></defs>`;
    points.forEach((p,i)=>{
      const cx = padL + slot*i + slot/2;
      const x = cx - bw/2;
      // rótulo do dia sempre visível no eixo, mesmo sem registro
      data += `<text x="${cx.toFixed(1)}" y="${h-9}" font-size="10" fill="var(--gray-1)" text-anchor="middle">${p.xLabel}</text>`;
      if(p.y == null){
        // dia sem registro: barra-guia fina e transparente, só para estruturar o plano cartesiano
        const gw = Math.max(3, bw*0.16);
        const gx = cx - gw/2;
        data += `<rect x="${gx.toFixed(1)}" y="${padT}" width="${gw.toFixed(1)}" height="${innerH}" rx="${gw/2}" fill="rgba(255,255,255,0.045)"/>`;
        return;
      }
      const top = yToPx(p.y);
      const bh = baseY - top;
      // faixa de fundo (mostra a altura máxima) fica estática; só a barra colorida anima o
      // crescimento de baixo para cima. O valor numérico aparece já no lugar certo, sem distorcer.
      data += `<rect x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${innerH}" rx="${rad}" fill="rgba(255,255,255,0.04)"/>`;
      data += `<path class="chart-bar-anim" d="${roundedTopBarPath(x, top, bw, bh, rad)}" fill="url(#${uid})"/>`;
      data += `<text x="${cx.toFixed(1)}" y="${(top-6).toFixed(1)}" font-size="11" font-weight="700" fill="var(--white)" text-anchor="middle">${p.y}</text>`;
    });
  }
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}${axes}${data}</svg>`;
}

/* Últimos N dias corridos (do mais antigo ao mais recente, incluindo hoje). */
function getLastNDates(days){
  const arr = [];
  const today = new Date();
  for(let i=days-1;i>=0;i--){
    const d = new Date(today);
    d.setDate(today.getDate()-i);
    arr.push(d);
  }
  return arr;
}

/* Qualidade dos últimos N dias — mesmo plano cartesiano, com uma barra grossa por registro real.
   TODOS os dias do período aparecem no eixo (mesmo sem registro), com uma barra-guia fina para
   os dias sem dado, para a barra real nunca ficar isolada no meio do gráfico. Nunca inventa valores. */
function buildQualityBarSection(days){
  // Para a janela de 7 dias, usamos sempre a semana corrente (DOM→SÁB) em ordem fixa,
  // em vez dos últimos 7 dias corridos — assim o eixo nunca começa num dia "aleatório".
  const dates = days === 7 ? getCurrentWeekDates() : getLastNDates(days);
  const byDate = {};
  state.sleepRecords.forEach(r=>{ byDate[r.date] = r; });
  const pts = dates.map(d=>{
    const key = todayKey(d);
    const rec = byDate[key];
    return { xLabel: weekdayShort(key), y: rec ? rec.quality : null };
  });
  const chart = buildCartesianChart(pts);
  const hasAny = pts.some(p=> p.y != null);
  return hasAny ? chart : `${chart}<div class="chart-empty-msg-sm">Ainda não há dados suficientes.</div>`;
}

/* Qualidade dos últimos 30 dias — matriz de blocos (heatmap) compacta, sem scroll horizontal.
   Cada quadradinho representa um dia; dias registrados acendem em tom azul proporcional à
   qualidade (1–5). Dias sem registro ficam discretos, nunca inventando dado. */
function buildQualityHeatmap(days){
  const dates = getLastNDates(days);
  const byDate = {};
  state.sleepRecords.forEach(r=>{ byDate[r.date] = r; });
  const hasAny = dates.some(d => byDate[todayKey(d)]);

  let cells = '';
  dates.forEach(d=>{
    const key = todayKey(d);
    const rec = byDate[key];
    const label = fmtDateBR(key) + (rec ? ` · qualidade ${rec.quality}/5` : ' · sem registro');
    if(!rec){
      cells += `<div class="heatmap-cell" title="${label}"></div>`;
      return;
    }
    const alpha = 0.22 + (rec.quality/5) * 0.78; // 1→mais claro, 5→azul vivo
    cells += `<div class="heatmap-cell" title="${label}" style="background:rgba(47,107,255,${alpha.toFixed(2)}); border-color:rgba(47,107,255,${Math.min(1,alpha+0.15).toFixed(2)});"></div>`;
  });

  const grid = `<div class="heatmap-grid">${cells}</div>`;
  const legend = `<div class="heatmap-legend">
      <span>Menos</span>
      <span class="sw" style="background:rgba(47,107,255,0.22);"></span>
      <span class="sw" style="background:rgba(47,107,255,0.5);"></span>
      <span class="sw" style="background:rgba(47,107,255,0.78);"></span>
      <span class="sw" style="background:rgba(47,107,255,1);"></span>
      <span>Mais</span>
    </div>`;
  if(!hasAny) return `${grid}<div class="chart-empty-msg-sm">Ainda não há dados suficientes.</div>`;
  return `${grid}${legend}`;
}

function buildProgressWeekCalendar(){
  const weekDates = getCurrentWeekDates();
  const todayStr = todayKey();
  let html = `<div class="pweek-grid">`;
  for(let i=0;i<7;i++){
    const d = weekDates[i];
    const key = todayKey(d);
    const done = !!state.checkins[key];
    html += `<div class="pweek-col${key===todayStr?' today':''}">
      <div class="pweek-lbl">${WEEKDAY_LABELS[i]}</div>
      <div class="pweek-day"><span class="pweek-fire">${done?'🔥':''}</span></div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

/* Donut construído com stroke-dasharray (anéis concêntricos), não com paths de arco manuais.
   Evita o bug do "path de arco degenerado" quando uma única categoria soma 100% dos registros
   (ângulo de 360°, onde ponto inicial e final coincidem e o path de arco falha em renderizar) —
   essa é a causa raiz da mancha central relatada. O furo do donut é natural (stroke, não fill),
   então não depende de sobrepor um círculo semitransparente por cima dos segmentos. */
function buildPieChart(records){
  let good=0, regular=0, low=0;
  records.forEach(r=>{
    if(r.quality>=4) good++;
    else if(r.quality===3) regular++;
    else low++;
  });
  const total = records.length;
  const size=160, cx=80, cy=80, r=58, strokeW=24;
  const circumference = 2*Math.PI*r;
  const colors = { good:'#2FA867', regular:'#E8B23D', low:'#D64545' };
  const segments = [ {v:good,c:colors.good}, {v:regular,c:colors.regular}, {v:low,c:colors.low} ].filter(s=>s.v>0);
  const gap = segments.length>1 ? 3 : 0;
  let offsetAcc = 0, rings = '';
  segments.forEach(seg=>{
    const len = (seg.v/total)*circumference;
    const dash = Math.max(len-gap, 0);
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.c}" stroke-width="${strokeW}"
      stroke-dasharray="${dash.toFixed(2)} ${(circumference-dash).toFixed(2)}" stroke-dashoffset="${(-offsetAcc).toFixed(2)}"
      stroke-linecap="${segments.length>1?'round':'butt'}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offsetAcc += len;
  });
  return `<div style="display:flex; justify-content:center;">
    <svg width="${size}" height="${size}" viewBox="0 0 160 160">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--gray-3)" stroke-width="${strokeW}"/>
      ${rings}
    </svg>
  </div>
  <div class="legend-row">
    <div class="legend-item"><span class="legend-dot" style="background:${colors.good}"></span>Boa (${good})</div>
    <div class="legend-item"><span class="legend-dot" style="background:${colors.regular}"></span>Regular (${regular})</div>
    <div class="legend-item"><span class="legend-dot" style="background:${colors.low}"></span>Baixa (${low})</div>
  </div>`;
}

/* Estágios do sono (Sem dormir/REM/Essencial/Profundo): Nivora não tem, hoje, uma fonte real
   desses dados (o check-in não coleta breakdown por estágio — só qualidade e energia). Em vez de
   fabricar valores, verificamos se algum registro já traz r.stages{} (preparado para o dia em que
   essa fonte existir) e, na ausência dela — o caso real atual — mostramos um estado vazio
   profissional em vez das barras zeradas que pareciam quebradas. */
function sleepStagesBlock(){
  const STAGE_DEFS = [
    {key:'awake', label:'Sem dormir'},
    {key:'rem', label:'REM'},
    {key:'core', label:'Essencial'},
    {key:'deep', label:'Profundo'}
  ];
  const last = state.sleepRecords.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id)[0];
  const stages = last && last.stages;
  const hasStageData = !!stages && STAGE_DEFS.some(s => typeof stages[s.key] === 'number');
  if(!hasStageData){
    return `<div class="empty-state" style="padding:12px 6px 2px;">
      <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M12 3.5L20.5 8.5L12 13.5L3.5 8.5L12 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M3.5 13L12 18L20.5 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.5 17.5L12 22.5L20.5 17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
      </svg></div>
      <p style="margin-bottom:0;">Sem dados suficientes para este período</p>
    </div>`;
  }
  return `<div class="stage-viz">` + STAGE_DEFS.map(s=>{
    const pct = Math.max(0, Math.min(100, Math.round(stages[s.key]||0)));
    return `<div class="stage-row"><span class="stage-lbl">${s.label}</span><div class="stage-track"><div class="stage-fill" style="width:${pct}%"></div></div></div>`;
  }).join('') + `</div>`;
}

function buildSleepClockSvg(){
  const bedtime = state.answers.bedtime || '23:00';
  const waketime = state.answers.waketime || '07:00';
  const toAngle = (hhmm)=>{ const [h,m] = hhmm.split(':').map(Number); return ((h%12)+m/60)/12*360 - 90; };
  const a1 = toAngle(bedtime), a2 = toAngle(waketime);
  const cx=90, cy=90, r=72;
  const large = ((a2-a1+360)%360) > 180 ? 1 : 0;
  const x1 = cx + r*Math.cos(a1*Math.PI/180), y1 = cy + r*Math.sin(a1*Math.PI/180);
  const x2 = cx + r*Math.cos(a2*Math.PI/180), y2 = cy + r*Math.sin(a2*Math.PI/180);
  let ticks = '';
  for(let i=0;i<12;i++){
    const ang = i*30 - 90;
    const isQuarter = i%3===0;
    const rOuter = 72, rInner = isQuarter ? 59 : 65;
    const tx1 = cx + rOuter*Math.cos(ang*Math.PI/180), ty1 = cy + rOuter*Math.sin(ang*Math.PI/180);
    const tx2 = cx + rInner*Math.cos(ang*Math.PI/180), ty2 = cy + rInner*Math.sin(ang*Math.PI/180);
    ticks += `<line x1="${tx1.toFixed(1)}" y1="${ty1.toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${ty2.toFixed(1)}" stroke="${isQuarter?'var(--white)':'var(--gray-2)'}" stroke-width="${isQuarter?2:1}" stroke-linecap="round"/>`;
  }
  return `<div class="monitor-clock-wrap">
    <svg class="monitor-clock-svg" viewBox="0 0 180 180">
      <circle cx="${cx}" cy="${cy}" r="80" fill="var(--black)"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--gray-3)" stroke-width="2"/>
      <path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="var(--blue)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      ${ticks}
      <circle cx="${cx}" cy="${cy}" r="3" fill="var(--white)"/>
    </svg>
    <div class="legend-row">
      <div class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span>Dormir ${bedtime}</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--gray-2)"></span>Acordar ${waketime}</div>
    </div>
  </div>`;
}

  document.getElementById('p-feedback').addEventListener('click', ()=> handleMenuItem('feedback'));
  document.getElementById('p-redo').addEventListener('click', ()=>{
    showConfirm(
      'Refazer configuração inicial?',
      'Suas respostas atuais de personalização serão apagadas e o questionário inicial será exibido novamente.',
      'Refazer',
      ()=>{
        state.answers = JSON.parse(JSON.stringify(DEFAULT_STATE.answers));

        startOnboarding(false);
      }

  });
}

function openPreferences(){
  openDetail('Preferências', `
    <div class="toggle-row">
      <span>Lembrete de rotina noturna</span>
      <div class="switch ${prefs().routineReminder ? 'on':''}" id="pref-reminder"></div>
    </div>
    <div class="toggle-row">
      <span>Lembrete de check-in</span>
      <div class="switch ${prefs().checkinReminder ? 'on':''}" id="pref-checkin"></div>
    </div>
  `);
  document.getElementById('pref-reminder').addEventListener('click', function(){
    togglePref('routineReminder'); this.classList.toggle('on');
  });
  document.getElementById('pref-checkin').addEventListener('click', function(){
    togglePref('checkinReminder'); this.classList.toggle('on');
  });
}
function prefs(){
  if(!state.prefs) state.prefs = { routineReminder:false, checkinReminder:false };
  return state.prefs;
}
function togglePref(key){
  const p = prefs();
  p[key] = !p[key];
  saveState();
}

function openSettings(){
  openDetail('Configurações', `
    <div class="list-group" style="margin-top:0;">
      <div class="list-item" id="s-edit"><div class="l"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Editar respostas do questionário</div><span class="chev">›</span></div>
    </div>

    <button class="btn danger-btn" id="s-clear">Apagar todos os dados</button>
  `);
  document.getElementById('s-edit').addEventListener('click', ()=>{ closeDetail(); startOnboarding(true); });

/* ============================================================
   SIDE MENU + DETAIL SCREEN
============================================================ */
const menuOverlay = document.getElementById('menu-overlay');
const sideMenu = document.getElementById('side-menu');
document.getElementById('open-menu-btn').addEventListener('click', ()=>{
  menuOverlay.classList.add('open');
  sideMenu.classList.add('open');
});
menuOverlay.addEventListener('click', closeMenu);
function closeMenu(){
  menuOverlay.classList.remove('open');
  sideMenu.classList.remove('open');
}

document.querySelectorAll('.menu-link').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    closeMenu();
    handleMenuItem(btn.getAttribute('data-menu'));
  });
});

function handleMenuItem(key){
  if(key === 'sobre') return openDetail('Sobre Nivora', aboutHtml());
  if(key === 'como') return openDetail('Como funciona', howItWorksHtml());
  if(key === 'config') return openSettings();
  if(key === 'privacidade') return openDetail('Política de Privacidade', privacyHtml());
  if(key === 'termos') return openDetail('Termos e Condições', termsHtml());
  if(key === 'ajuda') return openDetail('Ajuda', helpHtml());
  if(key === 'feedback'){ openDetail('Feedback', feedbackHtml()); bindFeedbackEvents(); return; }
}

function openDetail(title, bodyHtml){
  document.getElementById('detail-title').textContent = title;
  document.getElementById('detail-body').innerHTML = bodyHtml;
  document.getElementById('detail-screen').classList.add('open');
}
function closeDetail(){
  document.getElementById('detail-screen').classList.remove('open');
}
document.getElementById('detail-back-btn').addEventListener('click', closeDetail);

/* Confirm modal — substitui confirm() nativo por um diálogo no estilo do app */
function showConfirm(title, msg, confirmLabel, onConfirm){
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  const overlay = document.getElementById('confirm-overlay');
  const okBtn = document.getElementById('confirm-ok-btn');
  const cancelBtn = document.getElementById('confirm-cancel-btn');
  okBtn.textContent = confirmLabel;
  overlay.classList.add('open');
  function cleanup(){
    overlay.classList.remove('open');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.removeEventListener('click', cleanup);
  }
  function onOk(){ cleanup(); onConfirm(); }
  okBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', cleanup);
}

function openHistoryDetail(){
  const records = state.sleepRecords.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  const body = records.length === 0
    ? `<div class="empty-state"><div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a7 7 0 0 0 10.8 10.8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p>Seu histórico aparecerá aqui.<br>Registre sua primeira noite para começar a acompanhar sua evolução.</p></div>`
    : `<div class="card">` + records.map(r=>{
        const hasTime = r.sleepTime && r.wakeTime && r.durationMin != null;
        const midText = hasTime ? minutesToDuration(r.durationMin) : (FEELING_LABELS[r.energyWake] || '—');
        return `<div class="history-item">
          <div class="history-date">${fmtDateBR(r.date)}</div>
          <div class="history-mid"><div class="history-dur">${midText}</div></div>
          <div class="stars">${starString(r.quality)}</div>
        </div>`;
      }).join('') + `</div>`;
  openDetail('Histórico', body);
}

function feedbackHtml(){
  return `<p>Quer enviar uma sugestão, relatar um problema ou falar com a equipe?</p>
  <div class="field-label" style="margin-top:2px;">Sua avaliação</div>
  <div class="star-picker" id="fb-stars">${[1,2,3,4,5].map(n=>`<span class="star" data-val="${n}">★</span>`).join('')}</div>
  <div class="field-label">Mensagem</div>
  <textarea id="fb-message" rows="5" placeholder="Escreva aqui..." style="width:100%; background:var(--surface-2); border:1px solid var(--gray-3); border-radius:var(--radius-m); color:var(--white); padding:14px; font-size:14.5px; resize:vertical;"></textarea>
  <div style="margin-top:22px;">
    <button class="btn btn-primary" id="fb-send-btn" disabled>Enviar feedback</button>
  </div>`;
}

let feedbackDraft = { stars:0 };
function bindFeedbackEvents(){
  feedbackDraft = { stars:0 };
  const starsEl = document.getElementById('fb-stars');
  const msgEl = document.getElementById('fb-message');
  const btn = document.getElementById('fb-send-btn');
  function checkReady(){ btn.disabled = !(feedbackDraft.stars > 0 && msgEl.value.trim().length > 0); }
  starsEl.querySelectorAll('.star').forEach(s=>{
    s.addEventListener('click', ()=>{
      feedbackDraft.stars = parseInt(s.getAttribute('data-val'));
      starsEl.querySelectorAll('.star').forEach(st=> st.classList.toggle('active', parseInt(st.getAttribute('data-val')) <= feedbackDraft.stars));
      checkReady();
    });
  });
  msgEl.addEventListener('input', checkReady);
  btn.addEventListener('click', ()=>{
    try{
      if(!state.feedbackLog) state.feedbackLog = [];
      state.feedbackLog.push({ stars: feedbackDraft.stars, message: msgEl.value.trim(), ts: Date.now() });
      saveState();
      closeDetail();
      showToast('Enviado com sucesso ✅');
    }catch(e){
      showToast('Erro ao enviar. Tente novamente.');
    }
  });
}

/* ============================================================
   INTERFACE NÃO SELECIONÁVEL (complemento do CSS user-select:none)
   Bloqueia menu de contexto e início de seleção fora de campos editáveis.
   Inputs/textareas continuam com edição e seleção normais.
   Objetivo: evitar seleção/cópia ACIDENTAL pela interface — não é proteção de segurança.
============================================================ */
function isEditableTarget(t){
  const el = t && t.nodeType === 1 ? t : (t && t.parentElement);
  return !!(el && el.closest && el.closest('input, textarea, [contenteditable="true"]'));
}
document.addEventListener('contextmenu', (e)=>{ if(!isEditableTarget(e.target)) e.preventDefault(); });
document.addEventListener('selectstart', (e)=>{ if(!isEditableTarget(e.target)) e.preventDefault(); });
