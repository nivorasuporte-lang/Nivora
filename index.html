  <link rel="manifest" href="manifest.json">
    <style>
:root {
  --black:#000000;
  --blue:#0044CC;
  --blue-soft:rgba(0,68,204,0.16);
  --blue-soft-2:rgba(0,68,204,0.32);
  --blue-bright:#2F6BFF;
  --white:#FFFFFF;
  --gray-1:#8A8D93;
  --gray-2:#5B5E63;
  --gray-3:#26272B;
  --surface:#0A0A0C;
  --surface-2:rgba(17,17,20,0.80);
  --surface-3:rgba(23,24,28,0.80);
  --modal-opaque:#0c0c0e;
  --yellow:#E8B23D;
  --red:#D64545;
  --green:#2FA867;
  /* superfície dos cards de conteúdo (Início/Monitor/Progresso/Ajustes) — opacidade alta
     para que o starfield de fundo não prejudique leitura de textos/gráficos pequenos */
  --card-surface:rgba(15,16,20,0.97);
  --card-surface-strong:rgba(12,13,17,0.98);
  --card-border:rgba(255,255,255,0.11);
  --card-shadow:0 8px 24px rgba(0,0,0,0.38), 0 1px 3px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  --radius-l:22px;
  --radius-m:16px;
  --radius-s:10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

/* Comportamento de app nativo: textos, botões e cards da interface não são selecionáveis
   (sem seleção por toque prolongado nem menu Copiar/Compartilhar). Campos editáveis ficam
   liberados logo abaixo — precisam continuar aceitando digitação e seleção. */
*{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
input, textarea, [contenteditable="true"]{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
img{ -webkit-user-drag:none; }
html,body{
  margin:0; padding:0; height:100%; background:var(--black); color:var(--white);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overscroll-behavior-y: none;
}
body{ position:relative; overflow-x:hidden; }
button{ font-family:inherit; }
input, select, textarea{ font-family:inherit; }

#app{ position:relative; min-height:100vh; width:100%; max-width:560px; margin:0 auto; }

/* ---------- Star field background ---------- */
/* z-index:0 (e não -1) é proposital — ver comentário abaixo em #main-app/#onboarding-screen
   sobre o bug de "conteúdo some, só sobra o starfield" que o z-index negativo causava. */
#stars-bg{
  position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; pointer-events:none;
  background: radial-gradient(ellipse at 50% -10%, #06070a 0%, #000000 60%);
}
/* estrelas brancas e limpas, com uma vinheta escura suave atrás do conteúdo central,
   para o fundo não poluir a leitura dos textos */
#stars-bg canvas{ position:absolute; inset:0; width:100%; height:100%; opacity:1; }
#stars-bg::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 90% 62% at 50% 46%, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.22) 55%, rgba(0,0,0,0) 100%);
}

/* ---------- Utility ---------- */
.hidden{ display:none !important; }
.screen{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

/* FIX: containers below must sit in their own stacking context above the
   fixed star background (#stars-bg is position:fixed; z-index:0). Without
   an explicit position + z-index here, these are plain static elements,
   and per CSS painting order static content paints BEFORE positioned
   z-index:0 content — meaning the star canvas would render visually on
   top of the app content after any re-render. This is the root cause of
   the "content disappears, only starfield remains" bug. */
#main-app, #onboarding-screen{ position:relative; z-index:1; }
.px{ padding-left:20px; padding-right:20px; }
.muted{ color:var(--gray-1); }
.center{ display:flex; align-items:center; justify-content:center; }
.grow{ flex:1; }
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  border:none; cursor:pointer; border-radius:100px; padding:16px 20px;
  font-size:16px; font-weight:600; transition: transform .15s ease, opacity .15s ease, background .2s ease;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{ background:var(--blue); color:var(--white); width:100%; }
.btn-primary:disabled{ background:var(--gray-3); color:var(--gray-1); cursor:not-allowed; }
.btn-secondary{ background:var(--surface-3); color:var(--white); width:100%; }
.btn-ghost{ background:transparent; color:var(--blue); padding:10px 14px; }
.btn-white{ background:var(--white); color:var(--black); width:100%; }

/* ---------- Splash ---------- */
#splash-screen{
  position:fixed; inset:0; background:#000; z-index:100;
  display:flex; align-items:center; justify-content:center;
  transition: opacity .5s ease;
}
#splash-screen img{ width:150px; height:150px; object-fit:contain; opacity:0; animation: splashIn .6s ease forwards; }
#splash-screen .fallback-logo{ opacity:0; animation: splashIn .6s ease forwards; font-size:34px; font-weight:800; letter-spacing:0.5px; }
#splash-screen .fallback-logo .accent{ color:var(--blue); }
@keyframes splashIn{ from{ opacity:0; transform:scale(0.92);} to{ opacity:1; transform:scale(1);} }
#splash-screen.fade-out{ opacity:0; }

/* ---------- Logo ---------- */
.logo-wrap{ display:inline-flex; align-items:baseline; font-weight:800; letter-spacing:0.3px; white-space:nowrap; }
.logo-wrap .accent{ color:var(--blue); }

/* ---------- Onboarding ---------- */
#onboarding-screen{ display:none; flex-direction:column; min-height:100vh; padding-top:calc(38px + env(safe-area-inset-top,0px)); padding-bottom:24px; }
.ob-progress{ display:flex; gap:6px; padding:0 20px; margin-bottom:28px; }
.ob-progress .seg{ flex:1; height:4px; border-radius:4px; background:var(--gray-3); overflow:hidden; }
.ob-progress .seg.filled{ background:var(--blue); }
.ob-skip{ position:absolute; top:calc(20px + env(safe-area-inset-top,0px)); right:20px; color:var(--gray-1); font-size:14px; background:none; border:none; cursor:pointer; }
.ob-body{ flex:1; padding:0 20px; display:flex; flex-direction:column; }
.ob-eyebrow{ color:var(--blue); font-size:14px; font-weight:600; margin-bottom:10px; }
.ob-title{ font-size:28px; font-weight:800; line-height:1.25; margin:0 0 10px; }
.ob-sub{ color:var(--gray-1); font-size:15px; line-height:1.5; margin:0 0 28px; }
.ob-options{ display:flex; flex-direction:column; gap:10px; }
.ob-option{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  /* glassmorphism: vidro fosco translúcido + borda sutil */
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:var(--radius-m);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:0 6px 20px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
  padding:16px 18px; font-size:16px; color:var(--white); cursor:pointer;
  transition: transform .15s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
}
.ob-option:active{ transform:scale(0.98); }
.ob-option.selected{
  border-color:var(--blue-bright); background:rgba(0,68,204,0.22);
  box-shadow:0 0 0 1px rgba(47,107,255,0.55), 0 0 22px rgba(0,68,204,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
}
.ob-option .radio{ width:20px; height:20px; border-radius:50%; border:2px solid var(--gray-2); flex-shrink:0; position:relative; transition:border-color .2s ease; }
.ob-option.selected .radio{ border-color:var(--blue-bright); }
/* indicador sempre presente, preenchido com um "pop" suave ao selecionar */
.ob-option .radio::after{
  content:''; position:absolute; inset:3px; background:var(--blue-bright); border-radius:50%;
  transform:scale(0); opacity:0; transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .15s ease;
}
.ob-option.selected .radio::after{ transform:scale(1); opacity:1; }
.ob-footer{ padding:20px 20px 0; }
.time-picker-wrap{ display:flex; justify-content:center; padding:20px 0 8px; }
.time-picker-wrap input[type="time"]{
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:var(--white);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 6px 20px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
  font-size:34px; font-weight:700; padding:18px 22px; border-radius:var(--radius-m);
  text-align:center; width:100%; color-scheme: dark;
}
.ob-final{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 20px; }
/* ✓ da tela final: círculo azul sólido com brilho e alto contraste + entrada "pop-in" com bounce suave */
.ob-final .check-badge{
  width:88px; height:88px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #4C86FF 0%, var(--blue) 68%);
  display:flex; align-items:center; justify-content:center; margin-bottom:28px;
  font-size:44px; font-weight:800; line-height:1; color:var(--white);
  box-shadow:0 0 0 7px rgba(47,107,255,0.16), 0 0 34px rgba(0,68,204,0.7), inset 0 1px 0 rgba(255,255,255,0.35);
  animation: obBadgePop .75s ease-out both;
}
@keyframes obBadgePop{
  0%{ transform:scale(0.3); opacity:0; }
  55%{ transform:scale(1.14); opacity:1; }
  78%{ transform:scale(0.95); }
  100%{ transform:scale(1); opacity:1; }
}

/* ---------- Header ---------- */
#app-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;
  position:sticky; top:0; z-index:5; background:var(--black);
}
#app-header .logo-wrap{ font-size:19px; }
#app-header .logo-wrap::before{
  content:''; display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--blue); margin-right:7px; flex-shrink:0; position:relative; top:-1px;
}
.hamburger-btn{ background:none; border:none; color:var(--white); cursor:pointer; padding:6px; display:flex; }

/* ---------- Views ---------- */
#view-container{ flex:1; padding-bottom:calc(100px + var(--safe-bottom)); }
.view-section{ display:none; padding:4px 20px 8px; }
.view-section.active{ display:block; animation: viewIn .38s cubic-bezier(.22,.8,.3,1); }
@keyframes viewIn{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }

.section-title{ font-size:22px; font-weight:800; margin:18px 0 14px; }
.section-label{ font-size:13px; font-weight:600; color:var(--gray-1); margin:22px 0 10px; text-transform:none; display:flex; align-items:center; gap:6px; }
.section-label::before{ content:''; width:4px; height:4px; border-radius:50%; background:var(--blue); flex-shrink:0; opacity:0.85; }

/* identidade azul — acentos estratégicos, mais presentes no Monitor e no Progresso */
/* (removido) #view-monitor .card, #view-progress .card recebiam borda azul; agora usam a borda neutra padrão de .card */
.metric-card{ border-left:2.5px solid var(--blue-soft-2); }
.streak-hero .fire{ background:var(--blue-soft); border-radius:50%; padding:6px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; line-height:1; }

/* home hero — saudação + check-in da semana + CTA principal (composição contínua, sem cards) */
.home-hero{ padding-top:6px; }
.greeting-main{ font-size:26px; font-weight:700; letter-spacing:-0.2px; line-height:1.25; }
.greeting-sub{ font-size:14px; color:var(--gray-1); margin-top:5px; }

.week-strip{ display:flex; gap:7px; margin:32px 0 28px; }
/* Início: padronizado com o calendário do Progresso — nome do dia FORA/ACIMA do quadrado;
   dentro do quadrado (.week-day-box) aparece somente o 🔥 quando há check-in. */
.week-day{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:7px; }
.week-day-box{
  width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  background:var(--card-surface); border:1px solid var(--card-border); border-radius:var(--radius-s);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.week-day.today .week-day-box{ border-color:var(--blue); }
.week-day .wd-fire{ line-height:1; font-size:18px; }
.week-day .lbl{ font-size:10px; font-weight:700; color:var(--gray-2); letter-spacing:0.4px; }
.week-day.today .lbl{ color:var(--white); }

.checkin-cta{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; border:none; cursor:pointer; background:var(--blue); color:var(--white);
  font-size:16px; font-weight:600; padding:17px 20px; border-radius:100px;
  transition: transform .15s ease, opacity .15s ease, background .2s ease;
}
.checkin-cta:active{ transform:scale(0.97); }
.checkin-cta.is-done{ background:transparent; border:1.5px solid var(--gray-3); color:var(--gray-1); cursor:default; }
.checkin-cta.is-done:active{ transform:none; }
.checkin-cta .check-icon{ color:var(--blue); font-weight:700; }
.checkin-hint{ text-align:center; font-size:12.5px; color:var(--gray-2); margin-top:10px; }

/* card */
.card{
  background:var(--card-surface); border:1px solid var(--card-border); border-radius:var(--radius-l); padding:20px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.card + .card{ margin-top:14px; }

/* Progresso: espaçamento vertical levemente mais compacto entre cards/seções, para uma
   rolagem mais fluida no mobile — alteração restrita a esta aba. */
#view-progress .card + .card{ margin-top:10px; }
#view-progress .section-label{ margin:16px 0 8px; }
#view-progress .section-title{ margin:14px 0 12px; }

/* routine */
.routine-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
.routine-header .title{ font-size:16px; font-weight:700; }
.routine-header .count{ font-size:13px; color:var(--gray-1); font-weight:600; }
.routine-list{ margin-top:12px; display:flex; flex-direction:column; }
.routine-item{ display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid var(--gray-3); cursor:pointer; }
.routine-item:first-child{ border-top:none; }
.routine-item .time{ font-size:13px; color:var(--gray-1); font-weight:700; width:44px; flex-shrink:0; }
.routine-item .dot{ width:22px; height:22px; border-radius:50%; border:2px solid var(--gray-2); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent; transition:.15s ease;}
.routine-item.done .dot{ background:var(--blue); border-color:var(--blue); color:var(--white); }
.routine-item .step-icon{ width:18px; height:18px; color:var(--gray-2); flex-shrink:0; }
.routine-item.done .step-icon{ color:var(--blue); }
.routine-item .label{ font-size:15px; flex:1; }
.routine-item.done .label{ color:var(--gray-1); text-decoration: line-through; text-decoration-color: var(--gray-3); }

/* barra de progresso da rotina do dia — desliza suavemente até a nova porcentagem */
.routine-progress-track{ width:100%; height:6px; border-radius:100px; background:var(--gray-3); overflow:hidden; margin-top:12px; }
.routine-progress-fill{ height:100%; border-radius:100px; background:linear-gradient(90deg,#2F6BFF,#0044CC); width:0%; transition:width .3s ease; }

/* leve "pop" no checkbox ao concluir/desmarcar uma etapa da rotina */
@keyframes routineDotPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.3); } 100%{ transform:scale(1); } }
.routine-item .dot.pop{ animation: routineDotPop .32s cubic-bezier(.34,1.56,.64,1); }

/* how it works — rectangular containers (replaces "Última noite" block on Home) */
.hiw-box{
  display:flex; gap:14px; align-items:flex-start; background:var(--card-surface); border:1px solid var(--card-border); border-radius:var(--radius-m); padding:15px 17px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.hiw-box + .hiw-box{ margin-top:10px; }
.hiw-num{ width:26px; height:26px; border-radius:8px; background:var(--blue-soft); color:var(--blue); font-weight:800; font-size:12.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.hiw-txt b{ display:block; font-size:14.5px; margin-bottom:3px; color:var(--white); }
.hiw-txt span{ color:var(--gray-1); font-size:12.5px; line-height:1.4; }

/* recent summary */
.summary-row{ display:flex; align-items:center; justify-content:space-between; }
.summary-duration{ font-size:30px; font-weight:800; }
.stars{ letter-spacing:2px; color:var(--yellow); font-size:16px; }
.stars .off{ color:var(--gray-3); }
.empty-state{ text-align:center; padding:26px 10px; }
.empty-state .icon{ font-size:32px; margin-bottom:10px; opacity:0.7; }
.empty-state p{ color:var(--gray-1); font-size:14.5px; line-height:1.5; margin:0 0 18px; }

/* monitor — relógio protagonista, sem container ao redor */
.monitor-clock-wrap{ display:flex; flex-direction:column; align-items:center; padding:10px 0 8px; }
.monitor-clock-svg{ display:block; width:min(100%, 400px); height:auto; aspect-ratio:1/1; }

/* monitor */
.picker-row{ display:flex; gap:12px; }
.picker-box{ flex:1; background:var(--surface-3); border:1px solid var(--gray-3); border-radius:var(--radius-m); padding:14px 16px; }
.picker-box label{ display:block; font-size:12.5px; color:var(--gray-1); margin-bottom:8px; font-weight:600; }
.picker-box input[type="time"]{ background:transparent; border:none; color:var(--white); font-size:24px; font-weight:700; width:100%; padding:0; color-scheme: dark; }
.duration-pill{ display:flex; align-items:center; justify-content:center; gap:8px; margin:16px 0 4px; padding:14px; border-radius:var(--radius-m); background:var(--blue-soft); color:var(--blue); font-weight:700; font-size:15px; }

.star-picker{ display:flex; gap:10px; justify-content:center; margin:14px 0 4px; }
.star-picker .star{ font-size:34px; color:var(--gray-3); cursor:pointer; transition:.15s ease; }
.star-picker .star.active{ color:var(--yellow); }

.emoji-picker{ display:flex; justify-content:space-between; gap:8px; margin:14px 0 4px; }
.emoji-opt{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border-radius:var(--radius-m); border:1.5px solid var(--gray-3); cursor:pointer; }
.emoji-opt.selected{ border-color:var(--blue); background:var(--blue-soft); }
.emoji-opt .e{ font-size:22px; }
.emoji-opt .t{ font-size:10.5px; color:var(--gray-1); text-align:center; line-height:1.2; }
.emoji-opt.selected .t{ color:var(--white); }

.chip-group{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.chip{ padding:9px 14px; border-radius:100px; border:1.5px solid var(--gray-3); font-size:13.5px; color:var(--gray-1); cursor:pointer; }
.chip.selected{ border-color:var(--blue); background:var(--blue-soft); color:var(--white); }

/* último passo do questionário ("O que mais atrapalhou sua última noite?") — opções maiores,
   com mais respiro e um pouco mais abaixo, aproveitando o espaço vazio central */
#ob-multi-input{ margin-top:34px; gap:13px; }
#ob-multi-input .chip{ padding:14px 19px; font-size:15.5px; border-radius:14px; }

/* pergunta "Como você se sente agora?" — emojis com mais presença visual */
#ob-emoji-input .emoji-opt{ padding:16px 6px; }
#ob-emoji-input .e{ font-size:32px; }
#ob-emoji-input .t{ font-size:11.5px; }

.field-label{ font-size:13px; font-weight:700; color:var(--gray-1); margin:22px 0 4px; }
.field-label:first-child{ margin-top:0; }

.history-item{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--gray-3); }
.history-item:first-child{ border-top:none; }
.history-date{ font-size:13px; font-weight:700; color:var(--gray-1); width:56px; }
.history-mid{ flex:1; }
.history-dur{ font-size:15.5px; font-weight:700; }

/* progress */
.streak-hero{ display:flex; align-items:center; gap:14px; padding:6px 0 8px; }
.streak-hero .fire{ font-size:38px; animation: fireFlicker 2.4s ease-in-out infinite; will-change: transform, filter; }
@keyframes fireFlicker{
  0%,100%{ transform:scale(1); filter:drop-shadow(0 0 5px rgba(232,178,61,0.45)); }
  50%{ transform:scale(1.09); filter:drop-shadow(0 0 13px rgba(255,159,42,0.8)); }
}
.streak-hero .num{ font-size:32px; font-weight:800; }
.streak-hero .lbl{ font-size:13px; color:var(--gray-1); margin-top:2px; }

.chart-title{ font-size:15px; font-weight:700; margin-bottom:2px; }
.chart-sub{ font-size:12.5px; color:var(--gray-1); margin-bottom:14px; }
.chart-svg{ width:100%; height:auto; display:block; }

.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
.stat-box{
  background:var(--card-surface); border:1px solid var(--card-border); border-radius:var(--radius-m); padding:16px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.stat-box .val{ font-size:22px; font-weight:800; }
.stat-box .lbl{ font-size:12px; color:var(--gray-1); margin-top:4px; }

.energy-row{ display:flex; gap:12px; margin-top:14px; }
.energy-box{
  flex:1; background:var(--card-surface); border:1px solid var(--card-border); border-radius:var(--radius-m); padding:16px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.energy-box .val{ font-size:20px; font-weight:800; }
.energy-box .lbl{ font-size:12.5px; font-weight:700; margin-top:4px; }
.energy-box .note{ font-size:11.5px; color:var(--gray-1); margin-top:6px; line-height:1.4; }

.interpretation{ font-size:14.5px; line-height:1.6; color:var(--gray-1); margin-top:4px; }
.interpretation b{ color:var(--white); font-weight:700; }

.legend-row{ display:flex; gap:16px; margin-top:14px; justify-content:center; flex-wrap:wrap; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--gray-1); }
.legend-dot{ width:9px; height:9px; border-radius:50%; }

/* sleep stages viz (Monitor) */
.stage-viz{ display:flex; flex-direction:column; gap:11px; margin-top:4px; }
.stage-row{ display:flex; align-items:center; gap:10px; }
.stage-lbl{ width:78px; font-size:12px; color:var(--gray-1); font-weight:600; flex-shrink:0; }
.stage-track{ flex:1; height:8px; border-radius:100px; background:var(--surface-3); overflow:hidden; }
.stage-fill{ height:100%; border-radius:100px; background:var(--gray-2); transition:width .3s ease; }

/* empty bar-chart axis (Progress 7/30 day sections) */
.chart-empty-msg{ color:var(--gray-1); font-size:12.5px; font-weight:600; margin-bottom:10px; text-align:center; }
.chart-empty-msg-sm{ color:var(--gray-1); font-size:12px; font-weight:600; text-align:center; margin-top:8px; }

/* humanized inline stats — replaces KPI-grid dashboard blocks */
.plain-stat{ display:flex; align-items:baseline; justify-content:space-between; padding:7px 0; font-size:14.5px; }
.plain-stat span{ color:var(--gray-1); }
.plain-stat b{ font-weight:700; font-size:15.5px; }

/* Progresso — seção final de métricas (4.4): grid pequeno e organizado + 1 card de resumo
   em destaque, no lugar das linhas de texto soltas. */
.metrics-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.metric-card{
  background:var(--card-surface); border:1px solid var(--card-border); border-radius:var(--radius-m); padding:14px 16px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.metric-card.wide{ grid-column:1 / -1; }
.metric-card .metric-val{ font-size:19px; font-weight:800; color:var(--white); }
.metric-card .metric-lbl{ font-size:11.5px; color:var(--gray-1); margin-top:3px; }
.metric-dist{ display:flex; gap:16px; }
.metric-dist-item{ display:flex; align-items:baseline; gap:4px; }
.metric-dist-item .n{ font-size:15px; font-weight:800; }
.metric-dist-item .t{ font-size:11px; color:var(--gray-1); }

/* fundo sólido (não translúcido) — as estrelas do fundo fixo não podem "vazar" por trás do texto */
.summary-card{ background:#0f172a; border:1px solid var(--blue-soft-2); border-radius:var(--radius-l); padding:18px 20px; }

/* Heatmap de 30 dias — matriz de blocos compacta, sem scroll horizontal.
   Cada quadradinho acende em tom azul proporcional à qualidade do sono do dia. */
.heatmap-grid{ display:grid; grid-template-columns:repeat(10, 1fr); gap:6px; }
.heatmap-cell{
  aspect-ratio:1; border-radius:6px; background:rgba(255,255,255,0.045);
  border:1px solid rgba(255,255,255,0.05);
}
.heatmap-legend{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px; font-size:11px; color:var(--gray-1); }
.heatmap-legend .sw{ width:12px; height:12px; border-radius:3px; }
.quality-emoji-row{ display:flex; flex-wrap:wrap; gap:7px; margin-top:16px; font-size:19px; justify-content:center; }

/* profile */
.profile-header{ display:flex; align-items:center; gap:14px; padding:10px 0 22px; }
.profile-avatar{ width:56px; height:56px; border-radius:50%; background:var(--blue-soft); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:var(--blue); flex-shrink:0; }
.list-item{ display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-top:1px solid var(--gray-3); cursor:pointer; }
.list-item:first-child{ border-top:none; }
.list-item .l{ display:flex; align-items:center; gap:12px; font-size:15.5px; }
.list-item .l .ic{ width:20px; text-align:center; color:var(--gray-1); }
.list-item .chev{ color:var(--gray-2); }
.list-group{
  background:var(--card-surface); border:1px solid var(--card-border); border-radius:var(--radius-l); padding:6px 16px; margin-bottom:16px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}

/* bottom nav */
#bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:6; max-width:560px; margin:0 auto;
  display:flex; background:rgba(6,6,8,0.92); backdrop-filter: blur(14px);
  border-top:1px solid var(--gray-3); padding:10px 6px calc(10px + var(--safe-bottom));
}
.nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; color:var(--gray-2); cursor:pointer; padding:4px; }
.nav-item .ic{ width:24px; height:24px; }
.nav-item .lbl{ font-size:11px; font-weight:600; }
.nav-item.active{ color:var(--blue); }

/* side menu */
#menu-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter: blur(3px);
  z-index:20; opacity:0; pointer-events:none; transition: opacity .25s ease;
}
#menu-overlay.open{ opacity:1; pointer-events:auto; }
#side-menu{
  position:fixed; top:0; right:0; bottom:0; width:78%; max-width:300px; z-index:21;
  background:#08080a; border-left:1px solid var(--gray-3);
  transform: translateX(100%); transition: transform .28s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column; padding: calc(24px + env(safe-area-inset-top,0px)) 0 calc(16px + var(--safe-bottom));
}
#side-menu.open{ transform: translateX(0); }
.menu-logo{ padding:0 22px 22px; }
.menu-items{ flex:1; overflow-y:auto; }
.menu-link{ display:block; width:100%; text-align:left; background:none; border:none; color:var(--white); font-size:15.5px; padding:15px 22px; cursor:pointer; border-top:1px solid var(--gray-3); }
.menu-link:first-child{ border-top:none; }
.menu-version{ padding:14px 22px 4px; font-size:12px; color:var(--gray-2); }

/* detail overlay (menu sub-pages) */
#detail-screen{
  position:fixed; inset:0; z-index:30; background:var(--black); transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1); display:flex; flex-direction:column;
}
#detail-screen.open{ transform: translateY(0); }
.detail-header{ display:flex; align-items:center; gap:14px; padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px; border-bottom:1px solid var(--gray-3); }
.detail-header .back{ background:var(--surface-3); border:none; color:var(--white); width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.detail-header h2{ font-size:18px; font-weight:800; margin:0; }
.detail-body{ flex:1; overflow-y:auto; padding:22px 20px 40px; }
.detail-body p{ color:var(--gray-1); line-height:1.7; font-size:14.5px; margin:0 0 16px; }
.faq-item{ margin-bottom:18px; }
.faq-item .q{ font-weight:700; font-size:15px; margin-bottom:6px; }
.faq-item .a{ color:var(--gray-1); font-size:14px; line-height:1.6; }
.how-step{ display:flex; gap:14px; align-items:flex-start; margin-bottom:20px; }
.how-step .n{ width:30px; height:30px; border-radius:50%; background:var(--blue-soft); color:var(--blue); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.how-step .txt b{ display:block; font-size:15px; margin-bottom:3px; color:var(--white); }
.how-step .txt span{ color:var(--gray-1); font-size:13.5px; }

.toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--gray-3); }
.toggle-row:first-child{ border-top:none; }
.switch{ width:46px; height:27px; border-radius:100px; background:var(--gray-3); position:relative; cursor:pointer; transition:.2s ease; flex-shrink:0; }
.switch.on{ background:var(--blue); }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:var(--white); transition:.2s ease; }
.switch.on::after{ transform:translateX(19px); }

.danger-btn{ color:var(--red); background:var(--surface-2); border:1px solid rgba(214,69,69,0.4); }

.toast{
  position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px); z-index:50;
  background:var(--green); color:var(--white); padding:12px 20px; border-radius:100px; font-size:14px; font-weight:700;
  opacity:0; transition: all .25s ease; pointer-events:none; box-shadow:0 10px 30px rgba(0,0,0,0.4);
  white-space:nowrap;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast.celebrate{ background:linear-gradient(90deg,#2FA867,#22C55E); font-size:15px; padding:14px 24px; animation: toastCelebratePop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes toastCelebratePop{ 0%{ transform:translateX(-50%) translateY(20px) scale(.8); opacity:0;} 60%{ transform:translateX(-50%) translateY(-4px) scale(1.06); opacity:1;} 100%{ transform:translateX(-50%) translateY(0) scale(1); } }

/* confirm modal (substitui confirm() nativo) */
#confirm-overlay{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,0.6); backdrop-filter: blur(3px); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition: opacity .2s ease; padding:24px; }
#confirm-overlay.open{ opacity:1; pointer-events:auto; }
#confirm-box{ width:100%; max-width:340px; background:var(--modal-opaque); border:1px solid var(--gray-3); border-radius:var(--radius-l); padding:22px 20px 18px; transform:scale(0.95); transition:transform .2s ease; }
#confirm-overlay.open #confirm-box{ transform:scale(1); }
#confirm-title{ font-size:17px; font-weight:800; margin-bottom:8px; }
#confirm-msg{ font-size:14px; color:var(--gray-1); line-height:1.55; margin-bottom:20px; }
#confirm-actions{ display:flex; gap:10px; }
#confirm-actions .btn{ padding:12px; font-size:14.5px; }

/* check-in modal central — overlay + Home desfocada atrás (spec: Check-in modal central) */
#checkin-overlay{
  position:fixed; inset:0; z-index:36; background:rgba(0,0,0,0.66); backdrop-filter: blur(3px);
  display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none;
  transition: opacity .25s ease; padding:24px;
}
#checkin-overlay.open{ opacity:1; pointer-events:auto; }
#checkin-modal{
  width:100%; max-width:400px; max-height:82vh; overflow-y:auto;
  background:var(--modal-opaque); border:1px solid var(--gray-3); border-radius:var(--radius-l);
  padding:22px 20px 20px; transform:scale(0.95) translateY(6px); transition:transform .25s ease;
}
#checkin-overlay.open #checkin-modal{ transform:scale(1) translateY(0); }
.checkin-modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.checkin-modal-header h2{ font-size:18px; font-weight:800; margin:0; }
.checkin-close-btn{ background:var(--surface-3); border:none; color:var(--white); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
#main-app.content-blurred{ filter: blur(9px); transition: filter .25s ease; }

/* onboarding — tela de processamento entre a última pergunta e a conclusão
   hierarquia: mensagem -> porcentagem -> barra (todo o texto fica acima da barra) */
.ob-processing{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 10px; }
.processing-msg{ font-size:15px; color:var(--gray-1); text-align:center; min-height:20px; }
.processing-pct{ font-size:19px; font-weight:800; color:var(--blue); text-align:center; margin-top:10px; letter-spacing:0.2px; font-variant-numeric:tabular-nums; }
.processing-bar-track{ width:100%; max-width:320px; height:16px; border-radius:100px; background:var(--gray-3); overflow:visible; margin-top:14px; box-shadow:inset 0 1px 3px rgba(0,0,0,0.5); }
.processing-bar-fill{
  position:relative; width:0%; height:100%; border-radius:100px;
  background:linear-gradient(90deg, var(--blue) 0%, var(--blue-bright) 100%);
  box-shadow:0 0 14px rgba(47,107,255,0.55); will-change:width;
}
/* brilho azul na ponta da barra */
.processing-bar-fill::after{
  content:''; position:absolute; right:-3px; top:50%; width:14px; height:14px; margin-top:-7px; border-radius:50%;
  background:#A9C4FF; box-shadow:0 0 12px 5px rgba(47,107,255,0.8); opacity:0; transition:opacity .2s ease;
}
.processing-bar-fill.has-tip::after{ opacity:1; }

/* Barras do gráfico cartesiano (Progresso): crescem de baixo para cima ao abrir a aba/renderizar */
.chart-bar-anim{ transform-box: fill-box; transform-origin: 50% 100%; animation: chartBarGrow .4s cubic-bezier(.22,.8,.3,1) both; }
@keyframes chartBarGrow{ from{ transform:scaleY(0); opacity:.35; } to{ transform:scaleY(1); opacity:1; } }

/* calendário semanal do Progresso — quadrado individual por dia contendo SOMENTE o 🔥 (quando há
   check-in); o nome do dia (DOM-SÁB) fica ACIMA do quadrado. Classes próprias (pweek-*), distintas
   do .week-day do Início, para que as duas estruturas não interfiram uma na outra. */
.pweek-grid{ display:flex; gap:7px; }
.pweek-col{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:7px; }
.pweek-day{
  width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  background:var(--card-surface); border:1px solid var(--card-border); border-radius:var(--radius-s);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.pweek-col.today .pweek-day{ border-color:var(--blue); }
.pweek-fire{ line-height:1; font-size:18px; }
.pweek-lbl{ font-size:10px; font-weight:700; color:var(--gray-2); letter-spacing:0.4px; }
.pweek-col.today .pweek-lbl{ color:var(--white); }

/* ---------- Onboarding: entrada em cascata, glass e microinterações ---------- */
.ob-rise{ animation: obRise .5s cubic-bezier(.22,.8,.3,1) backwards; }
@keyframes obRise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }

#onboarding-screen .emoji-opt,
#onboarding-screen .chip{
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:0 6px 20px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
  transition: transform .15s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease, color .2s ease;
}
#onboarding-screen .emoji-opt:active,
#onboarding-screen .chip:active{ transform:scale(0.98); }
#onboarding-screen .emoji-opt.selected,
#onboarding-screen .chip.selected{
  border-color:var(--blue-bright); background:rgba(0,68,204,0.22);
  box-shadow:0 0 0 1px rgba(47,107,255,0.55), 0 0 22px rgba(0,68,204,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
}

/* tela final: título e subtítulo entram depois do ✓ */
.ob-final .ob-title, .ob-final .ob-sub{ animation: obRise .55s cubic-bezier(.22,.8,.3,1) .45s backwards; }
.ob-final .ob-sub{ animation-delay:.6s; }

/* saída suave do onboarding + entrada suave do app */
#onboarding-screen.ob-leaving{ opacity:0; transition:opacity .45s ease; pointer-events:none; }
#main-app.fade-in{ animation: mainFadeIn .45s ease; }
@keyframes mainFadeIn{ from{ opacity:0; } to{ opacity:1; } }

/* ---------- Polimento de contraste: cards com mais opacidade, borda refinada e sombra suave ---------- */
.card, .week-day-box, .pweek-day, .hiw-box, .stat-box, .energy-box, .metric-card, .list-group, .summary-card{ box-shadow:var(--card-shadow); }
#view-monitor .card, #view-monitor .stat-box,
#view-progress .card, #view-progress .stat-box, #view-progress .energy-box, #view-progress .metric-card{ background:var(--card-surface-strong); }

@media (prefers-reduced-motion: reduce){
  .ob-rise, .ob-final .ob-title, .ob-final .ob-sub, .ob-final .check-badge{ animation:none; }
}

::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<div id="app">
  <div id="stars-bg"><canvas id="stars-canvas"></canvas></div>

  <!-- SPLASH -->
  <div id="splash-screen">
    <img src="https://files.catbox.moe/otn3tf.png" alt="Nivora" onerror="this.style.display='none'; document.getElementById('splash-fallback').style.display='flex';">
    <div id="splash-fallback" class="fallback-logo" style="display:none;">NIVO<span class="accent">RA</span></div>
  </div>

  <!-- ONBOARDING -->
  <div id="onboarding-screen">
    <button class="ob-skip hidden" id="ob-skip-btn">pular</button>
    <div class="ob-progress" id="ob-progress"></div>
    <div class="ob-body" id="ob-body"></div>
    <div class="ob-footer">
      <button class="btn btn-primary" id="ob-continue-btn" disabled>Continuar</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="hidden">
    <header id="app-header">
      <div class="logo-wrap">NIVO<span class="accent">RA</span></div>
      <button class="hamburger-btn" id="open-menu-btn" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 7H20M4 12H20M4 17H20" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div id="view-container">
      <!-- HOME -->
      <section class="view-section" id="view-home"></section>
      <!-- MONITOR -->
      <section class="view-section" id="view-monitor"></section>
      <!-- PROGRESS -->
      <section class="view-section" id="view-progress"></section>
      <!-- PROFILE -->
      <section class="view-section" id="view-profile"></section>
    </div>

    <nav id="bottom-nav">
      <button class="nav-item" data-view="home">
        <svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4L20 11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10V19C6 19.5523 6.44772 20 7 20H10V15C10 14.4477 10.4477 14 11 14H13C13.5523 14 14 14.4477 14 15V20H17C17.5523 20 18 19.5523 18 19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="lbl">Início</span>
      </button>
      <button class="nav-item" data-view="monitor">
        <svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M20 14.5C18.75 15.15 17.32 15.5 15.8 15.5C10.9 15.5 6.9 11.5 6.9 6.6C6.9 5.08 7.25 3.65 7.9 2.4C4.5 3.7 2 7.02 2 11C2 16.52 6.48 21 12 21C15.98 21 19.3 18.5 20.6 15.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="lbl">Monitor</span>
      </button>
      <button class="nav-item" data-view="progress">
        <svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M5 20V13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 20V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 20V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="lbl">Progresso</span>
      </button>
      <button class="nav-item" data-view="profile">
        <svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 20C5.5 16.5 8.4 14.5 12 14.5C15.6 14.5 18.5 16.5 19.5 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="lbl">Ajustes</span>
      </button>
    </nav>
  </div>

  <!-- SIDE MENU -->
  <div id="menu-overlay"></div>
  <div id="side-menu">
    <div class="menu-logo"><div class="logo-wrap" style="font-size:18px;">NIVO<span class="accent">RA</span></div></div>
    <div class="menu-items">
      <button class="menu-link" data-menu="sobre">Sobre Nivora</button>
      <button class="menu-link" data-menu="como">Como funciona</button>
      <button class="menu-link" data-menu="config">Configurações</button>
      <button class="menu-link" data-menu="privacidade">Política de Privacidade</button>
      <button class="menu-link" data-menu="termos">Termos e Condições</button>
      <button class="menu-link" data-menu="ajuda">Ajuda</button>
      <button class="menu-link" data-menu="feedback">Feedback</button>
    </div>
    <div class="menu-version">Nivora - Versão 1.1.0</div>
  </div>

  <!-- DETAIL SCREEN (menu sub pages) -->
  <div id="detail-screen">
    <div class="detail-header">
      <button class="back" id="detail-back-btn">

<script>
/* ============================================================
   NIVORA — App de higiene do sono
   Persistência local via localStorage.
============================================================ */

const STORE_KEY = 'nivora_state_v1';

const DEFAULT_STATE = {
  onboardingComplete: false,
  answers: {
    goal: null,        // string
    bedtime: null,     // 'HH:MM'
    waketime: null,    // 'HH:MM'
    disruptor: null,   // string
    feeling: null       // string
  },
  baseline: null,      // { quality, feeling, factors:[], dateKey } — linha de base do onboarding (seções 27-28)
  checkins: {},        // { 'YYYY-MM-DD': { quality, energyWake, factors:[], ts } } — alimenta sequência + calendário
  routineProgress: {}, // { 'YYYY-MM-DD': [stepIndex,...] }
  sleepRecords: [],    // [{id, date, quality, energyWake, factors:[], sleepTime?, wakeTime?, durationMin?, baseline?}]
                       // sleepTime/wakeTime/durationMin só existem em registros legados do antigo "Registrar nova noite".
  onboardingEditMode: false
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
  }catch(e){
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

let state = loadState();

/* ---------------- Revisão única do onboarding (execução única desta versão) ----------------
   Não é um reset geral: toca apenas a flag onboardingComplete. Histórico, registros de
   sono, progresso e configurações permanecem intactos. Controlado por uma chave separada
   para que isto rode uma única vez, mesmo depois que o onboarding for concluído de novo. */
const RESET_MIGRATION_KEY = 'nivora_preview_reset_done_v1';
(function runOnboardingPreviewResetOnce(){
  try{
    if(!localStorage.getItem(RESET_MIGRATION_KEY)){
      if(state.onboardingComplete){
        state.onboardingComplete = false;
        saveState();
      }
      localStorage.setItem(RESET_MIGRATION_KEY, '1');
    }
  }catch(e){ /* localStorage indisponível: não faz nada, comportamento normal segue */ }
})();

/* ---------------- Helpers ---------------- */
function pad(n){ return n.toString().padStart(2,'0'); }
function todayKey(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDateBR(dateKey){
  const [y,m,d] = dateKey.split('-');
  const months = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  return `${parseInt(d)} ${months[parseInt(m)-1]}`;
}
const WEEKDAY_LABELS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

/* Vocabulário compartilhado entre o Check-in da Home e as perguntas de linha de base do onboarding */
const FEELING_OPTIONS = [
  {e:'😴', t:'Muito cansado', v:1},
  {e:'😐', t:'Cansado', v:2},
  {e:'🙂', t:'Normal', v:3},
  {e:'😊', t:'Bem', v:4},
  {e:'⚡', t:'Muito bem', v:5}
];
const FEELING_LABELS = Object.fromEntries(FEELING_OPTIONS.map(o=>[o.v,o.t]));
const DISRUPTOR_FACTORS = ['Pensamentos','Celular','Barulho','Calor','Horário irregular','Dificuldade para relaxar','Outro'];
function getGreeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Boa noite.';
  if(h < 12) return 'Bom dia.';
  if(h < 18) return 'Boa tarde.';
  return 'Boa noite.';
}

function toMinutes(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function minutesToDuration(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}h ${pad(m)}min`;
}
function calcDuration(sleepTime, wakeTime){
  let s = toMinutes(sleepTime), w = toMinutes(wakeTime);
  if(s===null || w===null) return null;
  let diff = w - s;
  if(diff <= 0) diff += 24*60;
  return diff;
}
function showToast(msg, opts){
  opts = opts || {};
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('celebrate', !!opts.celebrate);
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), opts.duration || 2200);
}
/* ícones lineares e discretos das etapas da rotina, por posição (0=desacelerar .. 3=dormir) */
const ROUTINE_ICONS = [
  '<svg viewBox="0 0 24 24" fill="none"><path d="M3 12c2.5-3 4.5-3 7 0s4.5 3 7 0 4.5-3 7 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none"><rect x="8" y="3" width="8" height="18" rx="2" stroke="currentColor" stroke-width="2"/><line x1="11" y1="17.5" x2="13" y2="17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none"><path d="M6 18C6 10 12 4 20 4C20 12 14 18 6 18Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 18C9 15 12 11 16 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  '<svg viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
];
function starString(n, max=5){
  let s='';
  for(let i=1;i<=max;i++) s += i<=n ? '★' : '<span class="off">★</span>';
  return s;
}

/* Streak calc: consecutive days ending today (or yesterday) with a checkin */
function computeStreak(){
  const dates = Object.keys(state.checkins).sort();
  if(dates.length === 0) return 0;
  const set = new Set(dates);
  let d = new Date();
  // if today not checked in yet, start counting from yesterday
  if(!set.has(todayKey(d))){
    d.setDate(d.getDate()-1);
  }
  let streak = 0;
  while(set.has(todayKey(d))){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function getCurrentWeekDates(){
  const now = new Date();
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - now.getDay());
  const arr = [];
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    arr.push(d);
  }
  return arr;
}

/* Routine steps generated from bedtime */
function getRoutineSteps(){
  const bedtime = state.answers.bedtime || '23:00';
  const base = toMinutes(bedtime);
  const steps = [
    { offset:-60, label:'Desacelerar', base:'default' },
    { offset:-40, label:'Reduzir estímulos', base:'default' },
    { offset:-20, label:'Momento de relaxamento', base:'default' },
    { offset:0,   label:'Dormir', base:'default' }
  ];
  // personalize based on disruptor / feeling
  if(state.answers.disruptor === 'Pensamentos acelerados'){
    steps[2].label = 'Desacelerar a mente';
  } else if(state.answers.disruptor === 'Dificuldade para relaxar'){
    steps[2].label = 'Relaxamento guiado';
  } else if(state.answers.disruptor === 'Horários irregulares'){
    steps[0].label = 'Manter horário consistente';
  } else if(state.answers.disruptor === 'Celular'){
    steps[1].label = 'Guardar o celular';
  }
  return steps.map((s, idx) => {
    let mins = (base + s.offset + 24*60) % (24*60);
    const h = Math.floor(mins/60), m = mins%60;
    return { time:`${pad(h)}:${pad(m)}`, label:s.label, idx };
  });
}

/* ============================================================
   STAR FIELD BACKGROUND
============================================================ */
function initStars(){
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let lastW = 0;
  function generateStars(w,h){
    // faixa de 260-340 pontos visíveis, ajustando dinamicamente conforme o tamanho da tela
    const count = Math.max(260, Math.min(340, Math.floor((w*h)/1300)));
    stars = Array.from({length:count}, ()=>({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*2.8 + 1.6,
      baseA: Math.random()*0.22 + 0.42,
      amp: Math.random()*0.4 + 0.35,
      phase: Math.random()*Math.PI*2,
      speed: Math.random()*0.0016 + 0.0004
    }));
  }
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * devicePixelRatio;
    canvas.height = h * devicePixelRatio;
    canvas.style.width = w+'px';
    canvas.style.height = h+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    // Só recria as posições das estrelas quando a LARGURA muda de verdade (rotação de tela,
    // redimensionamento real da janela). Em navegadores mobile, rolar a página some/mostra a
    // barra de endereço e dispara 'resize' mudando só a ALTURA — sem esta checagem, as estrelas
    // seriam sorteadas em novas posições a cada scroll (bug do "salto" no fundo estrelado).
    if(w !== lastW || stars.length === 0){
      generateStars(w, h);
      lastW = w;
    }
  }
  function draw(t){
    const w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      const pulse = (Math.sin(t*s.speed + s.phase) + 1) / 2; // 0..1
      const a = s.baseA + pulse*s.amp;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1,Math.max(0,a))})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
}

/* ============================================================
   SPLASH -> ONBOARDING / HOME
============================================================ */
function boot(){
  initStars();
  /* Causa do "fundo primeiro, cards depois": a interface só era montada DEPOIS do fade do splash,
     então durante o fade só o starfield aparecia. Agora a interface (app normal ou questionário)
     é montada de imediato, escondida atrás do splash opaco (z-index:100). O splash então faz o
     mesmo fade de antes (mesma duração) e revela fundo + interface completa ao mesmo tempo. */
  if(state.onboardingComplete){
    enterMainApp();
  }else{
    startOnboarding(false);
  }
  setTimeout(()=>{
    const splash = document.getElementById('splash-screen');
    splash.classList.add('fade-out');
    setTimeout(()=>{
      splash.style.display = 'none';
    }, 480);
  }, 1000);
}

/* ============================================================
   ONBOARDING
============================================================ */
const OB_QUESTIONS = [
  {
    key:'goal', type:'single',
    title:'O que você gostaria de melhorar no seu sono?',
    options:['Dormir mais cedo','Dormir por mais tempo','Ter uma rotina mais regular','Relaxar antes de dormir','Acordar melhor']
  },
  {
    key:'bedtime', type:'time',
    title:'Que horas você normalmente vai dormir?',
    default:'23:00'
  },
  {
    key:'waketime', type:'time',
    title:'Que horas você normalmente acorda?',
    default:'07:00'
  },
  {
    key:'disruptor', type:'single',
    title:'O que mais costuma atrapalhar seu sono?',
    options:['Pensamentos acelerados','Celular','Horários irregulares','Barulho','Dificuldade para relaxar','Outro']
  },
  {
    key:'feeling', type:'single',
    title:'Como você costuma se sentir ao acordar?',
    options:['Muito cansado','Cansado','Normal','Bem','Muito bem']
  },
  /* ---- Linha de base (seção 27): coletadas após as perguntas originais, antes da tela final ---- */
  {
    key:'baselineQuality', type:'stars',
    title:'Como foi sua última noite de sono?'
  },
  {
    key:'baselineFeeling', type:'emoji',
    title:'Como você se sente agora?'
  },
  {
    key:'baselineFactors', type:'multi', optional:true,
    title:'O que mais atrapalhou sua última noite?'
  }
];

let obIndex = 0;
let obDraft = {};

function startOnboarding(editMode){
  state.onboardingEditMode = !!editMode;
  obIndex = 0;
  const baselineSeed = state.baseline ? {
    baselineQuality: state.baseline.quality,
    baselineFeeling: state.baseline.feeling,
    baselineFactors: (state.baseline.factors || []).slice()
  } : {};
  obDraft = Object.assign({}, state.answers, baselineSeed);
  document.getElementById('onboarding-screen').style.display = 'flex';
  document.getElementById('main-app').classList.add('hidden');
  document.getElementById('ob-skip-btn').classList.toggle('hidden', !editMode);
  renderObProgress();
  renderObQuestion();
}

function renderObProgress(){
  const wrap = document.getElementById('ob-progress');
  wrap.classList.remove('hidden'); // reaparece nas perguntas (fica oculto só no processamento e na tela final)
  wrap.innerHTML = '';
  const total = OB_QUESTIONS.length + 1; // + final screen
  for(let i=0;i<total;i++){
    const seg = document.createElement('div');
    seg.className = 'seg' + (i <= obIndex ? ' filled' : '');
    wrap.appendChild(seg);
  }
}

function renderObQuestion(skipAnim){
  renderObProgress();
  const body = document.getElementById('ob-body');
  const contBtn = document.getElementById('ob-continue-btn');

  if(obIndex >= OB_QUESTIONS.length){
    startObProcessing();
    return;
  }

  const q = OB_QUESTIONS[obIndex];
  const eyebrow = `Pergunta ${obIndex+1} de ${OB_QUESTIONS.length}`;
  let html = `<div class="ob-eyebrow">${eyebrow}</div><h1 class="ob-title">${q.title}</h1>`;

  if(q.type === 'single'){
    html += `<div class="ob-options">`;
    for(const opt of q.options){
      const sel = obDraft[q.key] === opt ? ' selected' : '';
      html += `<div class="ob-option${sel}" data-opt="${opt}"><span>${opt}</span><span class="radio"></span></div>`;
    }
    html += `</div>`;
  } else if(q.type === 'time'){
    html += `<div class="ob-sub">Toque para escolher o horário.</div>
      <div class="time-picker-wrap"><input type="time" id="ob-time-input" value="${obDraft[q.key] || q.default}"></div>`;
  } else if(q.type === 'stars'){
    html += `<div class="ob-sub">Toque para avaliar.</div>
      <div class="star-picker" id="ob-star-input" style="justify-content:flex-start; gap:16px; margin-top:10px;">
        ${[1,2,3,4,5].map(n=>`<span class="star" data-val="${n}" style="font-size:40px;">★</span>`).join('')}
      </div>`;
  } else if(q.type === 'emoji'){
    html += `<div class="emoji-picker" id="ob-emoji-input" style="margin-top:10px;">
      ${FEELING_OPTIONS.map(o=>`<div class="emoji-opt" data-val="${o.v}"><span class="e">${o.e}</span><span class="t">${o.t}</span></div>`).join('')}
    </div>`;
  } else if(q.type === 'multi'){
    html += `<div class="ob-sub">Opcional — selecione quantas fizerem sentido.</div>
      <div class="chip-group" id="ob-multi-input" style="margin-top:8px;">
        ${DISRUPTOR_FACTORS.map(f=>`<div class="chip" data-val="${f}">${f}</div>`).join('')}
      </div>`;
  }

  body.innerHTML = html;

  /* entrada em cascata: título e opções sobem com fade-in, com pequeno atraso entre cada item.
     Só ao trocar de pergunta — selecionar uma opção NÃO refaz a animação. */
  if(!skipAnim){
    body.querySelectorAll('.ob-eyebrow, .ob-title, .ob-sub, .ob-option, .time-picker-wrap, #ob-star-input, .emoji-opt, .chip').forEach((el,i)=>{
      el.classList.add('ob-rise');
      el.style.animationDelay = Math.min(i*70, 700) + 'ms';
    });
  }

  if(q.type === 'single'){
    body.querySelectorAll('.ob-option').forEach(el=>{
      el.addEventListener('click', ()=>{
        obDraft[q.key] = el.getAttribute('data-opt');
        // atualiza no lugar (sem recriar o DOM) para o feedback de seleção animar suavemente
        body.querySelectorAll('.ob-option').forEach(x=> x.classList.toggle('selected', x === el));
        contBtn.disabled = false;
      });
    });
    contBtn.disabled = !obDraft[q.key];
  } else if(q.type === 'time'){
    if(!obDraft[q.key]) obDraft[q.key] = q.default;
    contBtn.disabled = false;
    const input = document.getElementById('ob-time-input');
    input.addEventListener('input', ()=>{ obDraft[q.key] = input.value; contBtn.disabled = !input.value; });
  } else if(q.type === 'stars'){
    const starWrap = document.getElementById('ob-star-input');
    const paintStars = ()=> starWrap.querySelectorAll('.star').forEach(st=> st.classList.toggle('active', parseInt(st.getAttribute('data-val')) <= (obDraft[q.key]||0)));
    paintStars();
    starWrap.querySelectorAll('.star').forEach(s=>{
      s.addEventListener('click', ()=>{
        obDraft[q.key] = parseInt(s.getAttribute('data-val'));
        paintStars();
        contBtn.disabled = false;
      });
    });
    contBtn.disabled = !obDraft[q.key];
  } else if(q.type === 'emoji'){
    const emojiWrap = document.getElementById('ob-emoji-input');
    emojiWrap.querySelectorAll('.emoji-opt').forEach(o=>{
      if(parseInt(o.getAttribute('data-val')) === obDraft[q.key]) o.classList.add('selected');
      o.addEventListener('click', ()=>{
        obDraft[q.key] = parseInt(o.getAttribute('data-val'));
        emojiWrap.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('selected'));
        o.classList.add('selected');
        contBtn.disabled = false;
      });
    });
    contBtn.disabled = !obDraft[q.key];
  } else if(q.type === 'multi'){
    if(!Array.isArray(obDraft[q.key])) obDraft[q.key] = [];
    const multiWrap = document.getElementById('ob-multi-input');
    multiWrap.querySelectorAll('.chip').forEach(c=>{
      if(obDraft[q.key].includes(c.getAttribute('data-val'))) c.classList.add('selected');
      c.addEventListener('click', ()=>{
        const v = c.getAttribute('data-val');
        const idx = obDraft[q.key].indexOf(v);
        if(idx>=0){ obDraft[q.key].splice(idx,1); c.classList.remove('selected'); }
        else{ obDraft[q.key].push(v); c.classList.add('selected'); }
      });
    });
    contBtn.disabled = false; // campo opcional
  }

  contBtn.textContent = 'Continuar';
  contBtn.onclick = ()=>{
    obIndex++;
    renderObQuestion();
  };
}

/* ============================================================
   ONBOARDING — TELA DE PROCESSAMENTO (entre a última pergunta e a conclusão)
============================================================ */
const OB_PROCESSING_STEPS = [
  { at:0,    msg:'Analisando suas respostas...' },
  { at:1300, msg:'Montando o seu plano personalizado...' },
  { at:2700, msg:'Tudo pronto!' }
];
function startObProcessing(){
  document.getElementById('ob-progress').classList.add('hidden');
  document.getElementById('ob-skip-btn').classList.add('hidden');
  const body = document.getElementById('ob-body');
  const contBtn = document.getElementById('ob-continue-btn');
  contBtn.classList.add('hidden');
  body.innerHTML = `
    <div class="ob-processing">
      <div class="processing-msg" id="ob-processing-msg">${OB_PROCESSING_STEPS[0].msg}</div>
      <div class="processing-pct" id="ob-processing-pct">0%</div>
      <div class="processing-bar-track"><div class="processing-bar-fill" id="ob-processing-fill"></div></div>
    </div>`;
  const fill = document.getElementById('ob-processing-fill');
  const msgEl = document.getElementById('ob-processing-msg');
  const pctEl = document.getElementById('ob-processing-pct');
  setTimeout(()=>{ msgEl.textContent = OB_PROCESSING_STEPS[1].msg; }, OB_PROCESSING_STEPS[1].at);
  setTimeout(()=>{ msgEl.textContent = OB_PROCESSING_STEPS[2].msg; }, OB_PROCESSING_STEPS[2].at);
  // progresso real 0%→100%: a barra e o número derivam do mesmo valor a cada frame,
  // então nunca dessincronizam. Curva única e contínua (seno suavizado + parcela linear),
  // sem os "tranques" que existiam entre um trecho e outro — o contador sobe de forma fluida.
  const total = 4000;
  const t0 = performance.now();
  function tick(now){
    const elapsed = Math.max(0, Math.min(now - t0, total));
    const p = elapsed / total;
    const eased = 0.6 * (0.5 - 0.5*Math.cos(Math.PI*p)) + 0.4 * p;
    const pctExact = eased * 100;
    fill.style.width = pctExact.toFixed(2) + '%'; // largura fracionada = movimento suave da barra
    pctEl.textContent = Math.round(pctExact) + '%';
    fill.classList.toggle('has-tip', pctExact > 1.5);
    if(elapsed < total) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(()=>{
    contBtn.classList.remove('hidden');
    renderObFinal();
  }, 4000);
}

function renderObFinal(){
  document.getElementById('ob-progress').classList.add('hidden');
  const body = document.getElementById('ob-body');
  body.innerHTML = `
    <div class="ob-final">
      <div class="check-badge">✓</div>
      <h1 class="ob-title" style="font-size:24px;">Sua rotina está pronta.</h1>
      <p class="ob-sub">Personalizamos sua experiência com base nas suas respostas.</p>
    </div>`;
  const contBtn = document.getElementById('ob-continue-btn');
  contBtn.disabled = false;
  contBtn.textContent = 'Começar';
  let leaving = false; // evita toque duplo durante o fade-out
  contBtn.onclick = ()=>{
    if(leaving) return;
    leaving = true;
    state.answers = {
      goal: obDraft.goal, bedtime: obDraft.bedtime, waketime: obDraft.waketime,
      disruptor: obDraft.disruptor, feeling: obDraft.feeling
    };
    state.baseline = {
      quality: obDraft.baselineQuality || null,
      feeling: obDraft.baselineFeeling || null,
      factors: (obDraft.baselineFactors || []).slice(),
      dateKey: todayKey()
    };
    applyBaselineToRecords();
    state.onboardingComplete = true;
    saveState();
    // fade-out do onboarding antes de mostrar a interface principal (sem troca brusca de tela)
    const obScreen = document.getElementById('onboarding-screen');
    const mainEl = document.getElementById('main-app');
    obScreen.classList.add('ob-leaving');
    setTimeout(()=>{
      obScreen.style.display = 'none';
      obScreen.classList.remove('ob-leaving');
      mainEl.classList.add('fade-in');
      enterMainApp();
      setTimeout(()=> mainEl.classList.remove('fade-in'), 500);
      if(state.onboardingEditMode){ showToast('Rotina atualizada.'); }
    }, 450);
  };
}

/* A linha de base vira um registro real (marcado) em sleepRecords, para alimentar o resumo
   inicial do Monitor e o indicador "último dia" do Progresso — nunca sobrescreve um check-in
   real já feito hoje (seções 26, 28, 50). */
function applyBaselineToRecords(){
  const b = state.baseline;
  if(!b || !b.quality) return;
  const key = b.dateKey;
  const idx = state.sleepRecords.findIndex(r=>r.date===key);
  if(idx>=0 && !state.sleepRecords[idx].baseline) return;
  const record = {
    id: idx>=0 ? state.sleepRecords[idx].id : Date.now(),
    date: key,
    quality: b.quality,
    energyWake: b.feeling,
    factors: b.factors.slice(),
    sleepTime: null, wakeTime: null, durationMin: null,
    baseline: true
  };
  if(idx>=0) state.sleepRecords[idx] = record;
  else state.sleepRecords.push(record);
}

  const el = document.getElementById('view-home');

      <span class="check-icon">✓</span>Check-in de hoje concluído
    </button>`;
  }else{
    checkinHtml = `<button class="checkin-cta" id="btn-open-checkin">Fazer check-in</button>
    <div class="checkin-hint">Leva menos de 1 minuto.</div>`;
  }

  const steps = getRoutineSteps();
  const doneSteps = state.routineProgress[todayStr] || [];
  const routinePct = steps.length ? Math.round((doneSteps.length/steps.length)*100) : 0;
  let routineHtml = `<div class="section-label">Rotina de hoje</div>
    <div class="card">
      <div class="routine-header">
        <span class="title">Rotina personalizada</span>
        <span class="count">${doneSteps.length} de ${steps.length} concluídas</span>
      </div>
      <div class="routine-progress-track"><div class="routine-progress-fill" id="routine-progress-fill"></div></div>
      <div class="routine-list">`;
  for(const s of steps){
    const done = doneSteps.includes(s.idx);
    routineHtml += `<div class="routine-item${done?' done':''}" data-step="${s.idx}">
      <span class="time">${s.time}</span>
      <span class="dot">${done?'✓':''}</span>
      <span class="step-icon">${ROUTINE_ICONS[s.idx] || ''}</span>
      <span class="label">${s.label}</span>
    </div>`;
  }
  routineHtml += `</div></div>`;

  const howHtml = homeHowItWorksHtml();

  el.innerHTML = `<div class="home-hero">${greetingHtml}${weekHtml}${checkinHtml}</div>` + routineHtml + howHtml;

  // anima a barra de progresso da rotina deslizando de 0 até a porcentagem atual
  const routineFillEl = document.getElementById('routine-progress-fill');
  if(routineFillEl){
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{ routineFillEl.style.width = routinePct + '%'; });
    });
  }

  el.querySelectorAll('.routine-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const idx = parseInt(item.getAttribute('data-step'));
      const arr = state.routineProgress[todayStr] || [];
      const pos = arr.indexOf(idx);
      const willBeDone = pos < 0;
      if(pos>=0) arr.splice(pos,1); else arr.push(idx);
      state.routineProgress[todayStr] = arr;
      saveState();

      // atualiza no lugar (sem recriar o DOM) para o feedback de seleção animar suavemente
      // e a barra de progresso deslizar do valor atual para o novo, nunca resetando para 0%.
      item.classList.toggle('done', willBeDone);
      const dotEl = item.querySelector('.dot');
      if(dotEl){
        dotEl.textContent = willBeDone ? '✓' : '';
        dotEl.classList.add('pop');
        dotEl.addEventListener('animationend', ()=> dotEl.classList.remove('pop'), { once:true });
      }
      const countEl = el.querySelector('.routine-header .count');
      const newPct = steps.length ? Math.round((arr.length/steps.length)*100) : 0;
      if(countEl) countEl.textContent = `${arr.length} de ${steps.length} concluídas`;
      const fillEl = document.getElementById('routine-progress-fill');
      if(fillEl) fillEl.style.width = newPct + '%';

      if(willBeDone){
        if(newPct === 100){
          showToast('🎉 Rotina de hoje concluída com sucesso!', { celebrate:true, duration:3000 });
        }else{
          showToast('✓ Concluído');
        }
      }
    });
  });

  const btnCheckin = document.getElementById('btn-open-checkin');
  if(btnCheckin) btnCheckin.addEventListener('click', openCheckinFlow);
  const btnGoto = document.getElementById('btn-goto-monitor');
  if(btnGoto) btnGoto.addEventListener('click', ()=> switchView('monitor'));
}

/* Um check-in por dia: se já existir um registro hoje (real ou de linha de base), atualiza;
   senão cria um novo. Mantém a mesma estrutura de sleepRecords usada pelo Monitor/Progresso. */
function upsertSleepRecordFromCheckin(dateKey, draft){
  const idx = state.sleepRecords.findIndex(r=>r.date===dateKey);
  if(idx>=0){
    const r = state.sleepRecords[idx];
    r.quality = draft.quality; r.energyWake = draft.feeling; r.factors = draft.factors.slice();
    delete r.baseline;
  }else{
    state.sleepRecords.push({ id: Date.now(), date: dateKey, quality: draft.quality, energyWake: draft.feeling, factors: draft.factors.slice(), sleepTime:null, wakeTime:null, durationMin:null });
  }
}

   PROGRESS VIEW
============================================================ */
function getRecordsInPeriod(days){
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - (days-1));
  const cutoffKey = todayKey(cutoff);
  return state.sleepRecords.filter(r => r.date >= cutoffKey).sort((a,b)=> a.date.localeCompare(b.date));
}
function getCheckinsInPeriod(days){
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - (days-1));
  const cutoffKey = todayKey(cutoff);
  return Object.entries(state.checkins).filter(([d])=> d >= cutoffKey).map(([d,v])=>Object.assign({date:d}, v));
}
/* O ponto mais recente disponível — pode ser um check-in real ou a linha de base do
   onboarding. É isto que "Qualidade do último dia" usa (seção 30). */
function getLastQualityRecord(){
  if(!state.sleepRecords.length) return null;
  return state.sleepRecords.slice().sort((a,b)=> a.date.localeCompare(b.date) || a.id-b.id).pop();
}

function renderProgress(){
  const el = document.getElementById('view-progress');
  const streak = computeStreak();
